build:
  system: docker
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 384

dockerfile_path: "./backend/Dockerfile.hostless"
start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 384

health_check:
  type: http
  http_path: "/api/health"
  interval_in_seconds: 30

workers:
  - name: "celery-worker"
    command: "celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1"
    min_cpu_per_replica: 0.1
    max_cpu_per_replica: 0.2
    min_memory_per_replica: 256
    max_memory_per_replica: 384
    replicas: 1
