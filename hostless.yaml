# Hostless deployment profile for the ZIAMIS demo.
# Verify these resource and manifest keys against the Hostless dashboard before provisioning.
build:
  system: docker
  min_cpu: 0.5
  max_cpu: 2
  min_memory: 512
  max_memory: 2048

dockerfile_path: backend/Dockerfile.hostless
working_directory: /
build_context_directory: /

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.3
  min_memory: 256
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 25

health_check:
  type: http
  http_path: /api/health
  interval_in_seconds: 30

workers:
  - name: celery-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1
    min_cpu_per_replica: 0.1
    max_cpu_per_replica: 0.2
    min_memory_per_replica: 128
    max_memory_per_replica: 256
    replicas: 1
