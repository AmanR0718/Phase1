name: Build signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-adhoc-ipa:
    name: Build iPhone installable Ad Hoc IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check signing configuration
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev-apk" ]]; then
            echo "::error::Run this workflow from the dev-apk branch."
            exit 1
          fi
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done

      - name: Check out dev-apk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Configure Hostless API URLs
        run: |
          echo "VITE_API_BASE_URL=https://cem.hostless.app" >> "$GITHUB_ENV"
          echo "VITE_API_PROD_URL=https://cem.hostless.app" >> "$GITHUB_ENV"
          echo "VITE_MOBILE_API_URL=https://cem.hostless.app" >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Set iOS deployment target for Capacitor Camera
        working-directory: frontend
        run: sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/App/Podfile

      - name: Sync Capacitor iOS project
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install

      - name: Import Apple signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cem-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-signing.p12"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -f pkcs12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERTIFICATE_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install Ad Hoc provisioning profile
        id: profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          rm -f "$PROFILE_PATH" "$PROFILE_PLIST"

      - name: Archive signed iOS app
        working-directory: frontend
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios-build/CEM.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER=zm.gov.agri.cem \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export Ad Hoc IPA
        working-directory: frontend
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p ios-build/export
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>zm.gov.agri.cem</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath ios-build/CEM.xcarchive \
            -exportPath ios-build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find ios-build/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          mkdir -p ios-build/delivery
          cp "$IPA_PATH" ios-build/delivery/CEM-Farmer-AdHoc.ipa

      - name: Upload installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: cem-farmer-dev-adhoc-ipa
          path: frontend/ios-build/delivery/CEM-Farmer-AdHoc.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/ios-signing.p12" "$RUNNER_TEMP/ios-profile.mobileprovision" "$RUNNER_TEMP/ios-profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
