# Build Android APK on push
# - Builds the mobile frontend against the Hostless CEM API.
# - Runs Capacitor sync and builds an Android debug APK.
# - Uploads the APK as a workflow artifact.

name: Build Android APK on Push

on:
  push:
    branches: [ main, farmer-edit-fix, deploy ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Hostless API URLs
        run: |
          echo "VITE_API_BASE_URL=https://cem.hostless.app" >> "$GITHUB_ENV"
          echo "VITE_API_PROD_URL=https://cem.hostless.app" >> "$GITHUB_ENV"
          echo "VITE_MOBILE_API_URL=https://cem.hostless.app" >> "$GITHUB_ENV"

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Install Capacitor & sync Android
        working-directory: frontend
        run: |
          npm ci
          npx cap sync android

      - name: Setup Java JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          target: android-33

      - name: Build Android APK (debug)
        working-directory: frontend/android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pci --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

