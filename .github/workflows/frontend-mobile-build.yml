# Workflow: Build frontend for mobile with VITE_MOBILE_API_URL
# Triggers: manual `workflow_dispatch` with optional `mobile_api_url` input.
# Produces: `frontend-dist` artifact containing `frontend/dist` (Vite build output).

name: Frontend Mobile Build

on:
  workflow_dispatch:
    inputs:
      mobile_api_url:
        description: 'Mobile API URL (VITE_MOBILE_API_URL). Optional; configure a VITE_* API URL in workflow secrets if omitted.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend with configured API URL
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_PROD_URL: ${{ secrets.VITE_API_PROD_URL }}
          VITE_MOBILE_API_URL: ${{ github.event.inputs.mobile_api_url || secrets.VITE_MOBILE_API_URL }}
        run: |
          set -e
          cd frontend
          if [ -z "${VITE_API_BASE_URL:-}" ] && [ -z "${VITE_API_PROD_URL:-}" ] && [ -z "${VITE_MOBILE_API_URL:-}" ]; then
            echo "Configure one of VITE_API_BASE_URL, VITE_API_PROD_URL, or VITE_MOBILE_API_URL before building."
            exit 1
          fi
          npm run build
        shell: bash
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
